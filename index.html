<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <title>Genius</title>
  </head>

  <body>

    <!-- ========== SONS DO JOGO ========== -->
    <audio src="./audios/background.mp3" loop autoplay id="backgroundMusic"></audio>
    <audio src="./audios/play.wav" id="somPlay"></audio>
    <audio src="./audios/buttonClick.wav" id="somClick"></audio>
    <audio src="./audios/color.wav" id="somCor"></audio>
    <audio src="./audios/correct.wav" id="somCerto"></audio>
    <audio src="./audios/error.wav" id="somErrado"></audio>

    <!-- ========== CÓDIGO ========== -->
    <main class="crt">
      <h1 class="title">Genius</h1>

      <div class="content">
        <div>
          <div id="indicador">
            <div id="indicadorPNG"></div>
            <span class="material-icons" id="iconeAcerto">check</span>
            <span class="material-icons" id="iconeErro">close</span>
          </div>
        </div>

        <div class="btnGroup">
          <div class="row1">
            <button class="btnRed btn" onclick="validarAcerto('R')">R</button>
            <button class="btnBlue btn" onclick="validarAcerto('B')">B</button>
          </div>

          <div class="row2">
            <button class="btnYellow btn" onclick="validarAcerto('Y')">
              Y
            </button>
            <button class="btnGreen btn" onclick="validarAcerto('G')">G</button>
          </div>
        </div>

        <div class="content">
          <div>
            <button class="play"></button>
            <p class="txt-botoes">Jogar</p>
          </div>
        </div>
      </div>

      <div class="display">
        <p id="textDisplay">Teste</p>
      </div>

      <div id="floatBtn">
        <button id="ranking"></button>
        <button id="config"></button>
      </div>

      <aside id="fundoRank">
        <div id="tabelaRanking">
          <button id="fecharRanking">
            <span class="material-icons">close</span>
          </button>

          <h2 class="tituloModal">Ranking</h2>

          <div id="listaRanking"></div>
        </div>
      </aside>

      <aside id="fundoConfig">
        <div id="boxConfig">
          <button id="fecharConfig">
            <span class="material-icons">close</span>
          </button>
          <h2 class="tituloModal">Config</h2>

          <div class="linhaCheckbox">
            <label for="crt">Efeito CRT</label>
            <input type="checkbox" name="crt" id="crtID" checked />
          </div>
          <div class="linhaCheckbox">
            <label for="musica">Música</label>
            <input type="checkbox" name="musica" id="musicaID" checked />
          </div>
          <div class="linhaCheckbox" id="linhaVolume">
            <label for="volumeMusica">Volume da Música</label>
            <input type="range" name="volumeMusica" id="volumeMusicaID" min="0.1" max="1" step="0.1" value="0.1"/>
          </div>
        </div>
      </aside>

      <aside id="fundoRegistroRank">
        <div id="registrarRanking">
          <button id="fecharRegistroRanking">
            <span class="material-icons">close</span>
          </button>

          <h2>Que pena...</h2>
          <h3>Insira seu nome para registrar a pontuação</h3>

          <div id="registrarNome">
            <input class="letras" id="letra1" placeholder="A" maxlength="1" />
            <input class="letras" id="letra2" placeholder="A" maxlength="1" />
            <input class="letras" id="letra3" placeholder="A" maxlength="1" />
          </div>

          <button class="salvarNome" id="salvarRanking">SALVAR</button>
          <p id="avisoNome">Preencha todos os campos</p>
        </div>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
  </body>
</html>
